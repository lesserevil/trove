name: CI
on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['docs/roadmap/**', 'CHANGELOG.md']
  pull_request:
    paths-ignore: ['docs/roadmap/**', 'CHANGELOG.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      version: ci-${{ github.sha }}
