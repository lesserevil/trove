name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable annotated release tag to recover
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-refs/tags/${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  metadata:
    name: Validate release tag and notes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          RELEASE_REVISION="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$RELEASE_REVISION" python scripts/release.py metadata
          echo "revision=$RELEASE_REVISION" >> "$GITHUB_OUTPUT"
  validate:
    needs: metadata
    uses: ./.github/workflows/validate.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      source-ref: ${{ needs.metadata.outputs.revision }}
      artifact-name: release-packages
  publish:
    name: Publish exact validated archives
    needs: [metadata, validate]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.metadata.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: _build/releases
      - name: Verify and publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REVISION: ${{ needs.metadata.outputs.revision }}
        run: |
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$RELEASE_REVISION" python scripts/release.py publish
